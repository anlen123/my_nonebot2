
    <!DOCTYPE html>
    <html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <title>牌组展示</title>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                background: #f5f5f5;
                margin: 0;
                padding: 20px;
            }

            .wrapper {
                max-width: 1300px;
                margin: 0 auto;
            }

            .area {
                border: 20px solid green;
                background: #fff;
                padding: 25px;
                position: relative;
            }

            .card-wrapper {
                display: flex;
                flex-wrap: wrap;
                justify-content: flex-start;
                gap: 15px;
                padding: 10px 0;
                list-style: none;
                margin: 0;
            }

            .ygo-card {
                position: relative;
                width: 110px;
                flex: 0 0 auto;
            }

            .ygo-card .card-image {
                position: relative;
                width: 100%;
            }

            .ygo-card .card-image img {
                width: 100%;
                height: auto;
                display: block;
                border-radius: 10px;
                box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            }

            /* 稀有度图标：右上角 */
            .rarity {
                position: absolute;
                top: -8px;
                right: -8px;
                z-index: 10;
            }

            .rarity img {
                width: 34px;
                height: 34px;
            }

            /* 份数图标：左下角 */
            .card-limit {
                position: absolute;
                bottom: -8px;
                left: -8px;
                z-index: 10;
            }

            .card-limit img {
                width: 32px;
                height: 32px;
            }

            /* === 新增：费用显示部分（移到最上面并缩小） === */
            .cost-header {
                text-align: left;
                margin-bottom: 20px;
                padding: 10px 15px;
                line-height: 1.4;
            }

            .cost-header img {
                width: 60px;          /* 原80px → 缩小到60px */
                height: 60px;
                vertical-align: middle;
            }

            .cost-header .card-number {
                font-size: 70px;      /* 原100px → 缩小到70px */
                font-weight: bold;
                margin-left: 15px;
                vertical-align: middle;
            }
        </style>
    </head>
    <body>
        <div class="wrapper">
            <div class="area">
                <!-- UR/SR 拆解费用：现在放在最上面 -->
                <div class="cost-header">
                    <img src="D:\\nb2\\my_nonebot2\\plugins\\nonebot_plugin_masterduel\\nonebot_plugin_masterduel\\img\UR" alt="UR">
                    <span class="card-number">： 0</span>
                    <br>
                    <img src="D:\\nb2\\my_nonebot2\\plugins\\nonebot_plugin_masterduel\\nonebot_plugin_masterduel\\img\SR" alt="SR">
                    <span class="card-number">： 0</span>
                </div>

                <br><br>
                <!-- 主卡组 -->
                <div class="area-item">
                    <ul class="card-wrapper">
                        
                    </ul>
                </div>
                <br><br>
                <!-- 额外卡组 -->
                <div class="area-item">
                    <ul class="card-wrapper">
                        
                    </ul>
                </div>
            </div>
        </div>
    </body>
    </html>
